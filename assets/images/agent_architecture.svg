<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-label="Multi-agent job application architecture">
  <rect width="1100" height="620" fill="#f8fafc"/>
  <text x="40" y="36" font-family="IBM Plex Mono, Menlo, monospace" font-size="13" fill="#0f766e" letter-spacing="1.5">SYSTEM ARCHITECTURE</text>
  <text x="40" y="62" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Multi-Agent Job Application Graph</text>

  <rect x="40" y="90" width="200" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="140" y="120" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">JD + Profile</text>
  <text x="140" y="140" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="11" fill="#475569">typed input state</text>

  <rect x="310" y="90" width="480" height="70" rx="10" fill="#0b3b4a"/>
  <text x="550" y="120" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff">Orchestrator / LangGraph</text>
  <text x="550" y="140" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="11" fill="#ccfbf1">routing · retries · shared state · traces</text>

  <rect x="860" y="90" width="200" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="960" y="120" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Eval + Artifacts</text>
  <text x="960" y="140" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="11" fill="#475569">scores · logs · versions</text>

  <line x1="240" y1="125" x2="310" y2="125" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="310,125 300,120 300,130" fill="#94a3b8"/>
  <line x1="790" y1="125" x2="860" y2="125" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="860,125 850,120 850,130" fill="#94a3b8"/>

  <line x1="550" y1="160" x2="550" y2="210" stroke="#94a3b8" stroke-width="2"/>

  <g>
    <rect x="40" y="220" width="190" height="150" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="40" y="220" width="190" height="8" rx="4" fill="#0f766e"/>
    <text x="135" y="258" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Parser Agent</text>
    <text x="135" y="286" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="12" fill="#475569">skills · must-haves</text>
    <text x="135" y="306" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="12" fill="#475569">seniority · blockers</text>
    <text x="135" y="338" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="10" fill="#0f766e">owns: schema</text>
  </g>

  <g>
    <rect x="255" y="220" width="190" height="150" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="255" y="220" width="190" height="8" rx="4" fill="#0f766e"/>
    <text x="350" y="258" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Research Agent</text>
    <text x="350" y="286" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="12" fill="#475569">tools + RAG only</text>
    <text x="350" y="306" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="12" fill="#475569">evidence pack</text>
    <text x="350" y="338" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="10" fill="#0f766e">owns: retrieval</text>
  </g>

  <g>
    <rect x="470" y="220" width="190" height="150" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
    <rect x="470" y="220" width="190" height="8" rx="4" fill="#0f766e"/>
    <text x="565" y="258" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Writer Agent</text>
    <text x="565" y="286" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="12" fill="#475569">resume bullets</text>
    <text x="565" y="306" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="12" fill="#475569">cover letter draft</text>
    <text x="565" y="338" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="10" fill="#0f766e">owns: generation</text>
  </g>

  <g>
    <rect x="685" y="220" width="190" height="150" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
    <rect x="685" y="220" width="190" height="8" rx="4" fill="#b45309"/>
    <text x="780" y="258" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Critic Agent</text>
    <text x="780" y="286" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="12" fill="#475569">coverage · factuality</text>
    <text x="780" y="306" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="12" fill="#475569">reject / revise / ok</text>
    <text x="780" y="338" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="10" fill="#b45309">owns: policy</text>
  </g>

  <g>
    <rect x="900" y="220" width="160" height="150" rx="12" fill="#ffffff" stroke="#0b3b4a" stroke-width="1.5"/>
    <rect x="900" y="220" width="160" height="8" rx="4" fill="#0b3b4a"/>
    <text x="980" y="258" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Executor</text>
    <text x="980" y="286" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="12" fill="#475569">package files</text>
    <text x="980" y="306" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="12" fill="#475569">human gate</text>
    <text x="980" y="338" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="10" fill="#0b3b4a">owns: action</text>
  </g>

  <path d="M135 370 L135 410 L980 410 L980 370" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="550" y="400" text-anchor="middle" font-family="IBM Plex Mono, Menlo, monospace" font-size="11" fill="#64748b">SHARED STATE  ·  Pydantic  ·  run_id / evidence / drafts / scores</text>

  <rect x="40" y="445" width="480" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="60" y="478" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Feedback loop</text>
  <text x="60" y="506" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="13" fill="#475569">Critic may return work to Writer with a structured</text>
  <text x="60" y="526" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="13" fill="#475569">revision request. Writer cannot self-approve.</text>
  <text x="60" y="556" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" fill="#0f766e">revise  →  rewrite  →  re-score</text>

  <rect x="540" y="445" width="520" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="560" y="478" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Human-in-the-loop</text>
  <text x="560" y="506" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="13" fill="#475569">Executor never sends outbound applications without</text>
  <text x="560" y="526" font-family="IBM Plex Sans, Helvetica, sans-serif" font-size="13" fill="#475569">explicit approval. Failures route to fallback, not silence.</text>
  <text x="560" y="556" font-family="IBM Plex Mono, Menlo, monospace" font-size="12" fill="#0b3b4a">approve  ·  edit  ·  abort</text>
</svg>
